[server]
# Streamlit's file watcher scans every imported module; on transformers it tries to import optional
# vision models (torchvision) and floods the terminal with harmless tracebacks. Restart after edits.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
# The indexing-stage blue from src/visuals.py, so buttons and sliders match the pipeline colors
# instead of Streamlit's default red. Applies to both the light and the dark theme.
primaryColor = "#2563EB"
