name: Keep Streamlit app awake

# Visits the app every other day at 06:17 UTC (odd days of the month, so the 31st and the 1st both
# run). Community Cloud sleeps an app after ~12 hours without visitors, so this wakes it up on those
# days rather than keeping it awake continuously; "17 */6 * * *" would do that instead.
# "Run workflow" on the Actions tab triggers it by hand.
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Visit the app
        run: python .github/scripts/keep_awake.py
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep-awake-failure.png
          if-no-files-found: ignore
